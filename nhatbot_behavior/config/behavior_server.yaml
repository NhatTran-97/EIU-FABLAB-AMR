behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 100.0
    behavior_plugins: ["spin", "backup", "wait"]
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3 # retrieving the transformation of the robot
    simulate_ahead_time: 2.0 
    max_rotational_vel: 1.0 # rad/s
    min_rotational_vel: 0.4 # rad/s
    rotational_acc_lim: 3.2 # rad/s^2

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp" # move backward
    
    wait:
      plugin: "nav2_behaviors/Wait"